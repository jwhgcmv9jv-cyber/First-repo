<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Irbis Пульт">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Irbis Пульт</title>
<style>
  :root {
    --bg: #12151b; --panel: #1c212a; --btn: #2a313d; --btn-active: #3d4757;
    --text: #e8ecf2; --muted: #8b95a5; --accent: #e0612b; --ok: #2fa36b; --err: #d64545;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  body { padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  #dot.ok { background: var(--ok); } #dot.err { background: var(--err); }
  nav { display: flex; gap: 8px; margin-bottom: 12px; }
  nav button { flex: 1; padding: 12px; border: 0; border-radius: 12px; background: var(--panel); color: var(--muted); font-size: 16px; }
  nav button.on { background: var(--accent); color: #fff; }
  main { flex: 1; display: flex; min-height: 0; }
  section { display: none; flex: 1; min-height: 0; }
  section.on { display: flex; }
  .btn { border: 0; border-radius: 14px; background: var(--btn); color: var(--text); font-size: 17px;
    min-height: 64px; padding: 8px; display: flex; align-items: center; justify-content: center; text-align: center;
    touch-action: manipulation; transition: background .08s, transform .08s; }
  .btn.pressed { background: var(--btn-active); transform: scale(.96); }
  .btn.accent { background: var(--accent); color: #fff; }
  .btn.red { background: #7a2626; }
  .btn small { display: block; color: var(--muted); font-size: 12px; }

  /* Пульт */
  #remote { gap: 16px; flex-wrap: wrap; align-content: flex-start; overflow-y: auto; }
  .col { flex: 1 1 300px; display: flex; flex-direction: column; gap: 12px; }
  .grid { display: grid; gap: 10px; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g2 { grid-template-columns: repeat(2, 1fr); }
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; aspect-ratio: 1; max-width: 360px; width: 100%; margin: 0 auto; }
  .dpad .btn { font-size: 28px; }
  .dpad .ok { border-radius: 50%; background: var(--accent); color: #fff; font-size: 20px; }
  .card { background: var(--panel); border-radius: 18px; padding: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  /* Тачпад */
  #touch { flex-direction: column; gap: 10px; }
  #pad { flex: 1; min-height: 240px; background: var(--panel); border-radius: 18px; border: 1px solid #2c3442;
    touch-action: none; position: relative; overflow: hidden; }
  #pad.abs { aspect-ratio: 16 / 9; flex: 0 1 auto; width: 100%; max-height: 70vh; margin: 0 auto; }
  #pad .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; padding: 20px; pointer-events: none; font-size: 14px; line-height: 1.5; }
  .ripple { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
    background: rgba(224, 97, 43, .5); pointer-events: none; animation: rp .4s ease-out forwards; }
  @keyframes rp { to { transform: scale(2.2); opacity: 0; } }
  .row { display: flex; gap: 10px; align-items: center; }
  .row .btn { flex: 1; }
  label.sens { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }

  /* Текст */
  #textsec { flex-direction: column; gap: 10px; }
  textarea { width: 100%; min-height: 140px; border-radius: 14px; border: 1px solid #2c3442; background: var(--panel);
    color: var(--text); font-size: 18px; padding: 12px; -webkit-user-select: text; user-select: text; resize: vertical; }

  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--err); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; max-width: 90%; }
  .hide { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Irbis Пульт</h1>
  <div id="status"><span id="dot"></span><span id="stxt">подключение…</span></div>
</header>

<nav>
  <button data-tab="remote" class="on">Пульт</button>
  <button data-tab="touch">Тачпад</button>
  <button data-tab="textsec">Текст</button>
</nav>

<main>
  <!-- ПУЛЬТ -->
  <section id="remote" class="on">
    <div class="col">
      <div class="card">
        <div class="dpad">
          <span></span><button class="btn" data-key="up" data-repeat>▲</button><span></span>
          <button class="btn" data-key="left" data-repeat>◀</button>
          <button class="btn ok" data-key="ok">OK</button>
          <button class="btn" data-key="right" data-repeat>▶</button>
          <span></span><button class="btn" data-key="down" data-repeat>▼</button><span></span>
        </div>
      </div>
      <div class="grid g3">
        <button class="btn" data-key="back">↩ Назад</button>
        <button class="btn" data-key="home">⌂ Домой</button>
        <button class="btn" data-key="apps">▤ Окна</button>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <h2>Громкость</h2>
        <div class="grid g3">
          <button class="btn" data-key="vol_down" data-repeat>🔉 −</button>
          <button class="btn" data-key="mute">🔇</button>
          <button class="btn" data-key="vol_up" data-repeat>🔊 +</button>
        </div>
      </div>
      <div class="card">
        <h2>Презентация / страницы</h2>
        <div class="grid g2">
          <button class="btn" data-key="page_up" data-repeat>◀ Пред. слайд</button>
          <button class="btn accent" data-key="page_down" data-repeat>След. слайд ▶</button>
        </div>
        <div class="grid g3" style="margin-top:10px">
          <button class="btn" data-key="f5" data-only="local">▶ Показ<small>F5</small></button>
          <button class="btn" data-key="black" data-only="local">⬛ Экран<small>чёрный</small></button>
          <button class="btn" data-key="play_pause">⏯</button>
        </div>
      </div>
      <div class="card">
        <h2>Система</h2>
        <div class="grid g3">
          <button class="btn" data-key="menu">☰ Меню</button>
          <button class="btn" data-key="input" data-only="adb">⇄ Источник</button>
          <button class="btn" data-key="settings" data-only="adb">⚙ Настройки</button>
          <button class="btn" data-key="desktop" data-only="local">🖥 Рабочий стол</button>
          <button class="btn" data-key="close" data-only="local">✕ Закрыть<small>Alt+F4</small></button>
          <button class="btn" data-key="wakeup" data-only="adb">☀ Разбудить</button>
          <button class="btn red" data-key="power" data-only="adb" data-confirm="Отправить кнопку питания на панель?">⏻ Питание</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ТАЧПАД -->
  <section id="touch">
    <div id="pad"><div class="hint" id="padhint"></div></div>
    <div class="row" id="relctl">
      <button class="btn" id="lclick">Левая</button>
      <button class="btn" id="dragbtn">Удерживать</button>
      <button class="btn" id="rclick">Правая</button>
    </div>
    <label class="sens" id="senswrap">Чувствительность <input type="range" id="sens" min="0.5" max="5" step="0.1" value="2"></label>
  </section>

  <!-- ТЕКСТ -->
  <section id="textsec">
    <textarea id="txt" placeholder="Введите текст — он будет напечатан на панели"></textarea>
    <div class="row">
      <button class="btn accent" id="sendtxt">Отправить текст</button>
      <button class="btn" data-key="enter">⏎ Enter</button>
      <button class="btn" data-key="backspace" data-repeat>⌫</button>
    </div>
    <p id="txtnote" style="color:var(--muted);font-size:14px;margin:0"></p>
  </section>
</main>

<div id="toast"></div>

<script>
(() => {
  // ---------- Сеть ----------
  const qs = new URLSearchParams(location.search);
  let pin = qs.get("pin");
  try { if (pin) localStorage.setItem("irbis_pin", pin); else pin = localStorage.getItem("irbis_pin"); } catch (e) {}
  const headers = { "Content-Type": "application/json" };
  if (pin) headers["X-Pin"] = pin;

  const dot = document.getElementById("dot"), stxt = document.getElementById("stxt");
  const toastEl = document.getElementById("toast");
  let toastT;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.style.display = "block";
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.style.display = "none", 3000);
  }
  function setStatus(ok, txt) { dot.className = ok ? "ok" : "err"; stxt.textContent = txt; }

  async function api(path, body) {
    try {
      const r = await fetch("/api/" + path, { method: "POST", headers, body: JSON.stringify(body || {}) });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        toast(j.error || ("Ошибка " + r.status));
        if (r.status >= 500) setStatus(false, "нет связи с панелью");
        return false;
      }
      return true;
    } catch (e) {
      setStatus(false, "сервер недоступен"); toast("Сервер недоступен"); return false;
    }
  }

  let info = null;
  async function loadInfo() {
    try {
      const r = await fetch("/api/info", { headers });
      if (r.status === 401) {
        const p = prompt("PIN для пульта:");
        if (p) { try { localStorage.setItem("irbis_pin", p); } catch (e) {} location.search = "?pin=" + encodeURIComponent(p); }
        return;
      }
      info = await r.json();
      setStatus(true, modeLabel());
      applyMode();
    } catch (e) { setStatus(false, "сервер недоступен"); setTimeout(loadInfo, 3000); }
  }

  function applyMode() {
    document.querySelectorAll("[data-only]").forEach(el => el.classList.toggle("hide", el.dataset.only !== info.mode));
    const abs = info.pad === "absolute";
    pad.classList.toggle("abs", abs);
    document.getElementById("relctl").classList.toggle("hide", abs);
    document.getElementById("senswrap").classList.toggle("hide", abs);
    document.getElementById("padhint").innerHTML = abs
      ? "Это уменьшенный экран панели.<br>Касание — нажатие в этой точке, проведите — свайп,<br>удерживайте — долгое нажатие, два пальца — прокрутка."
      : "Водите пальцем — курсор.<br>Касание — клик, касание двумя пальцами — правый клик,<br>два пальца вверх/вниз — прокрутка.";
    document.getElementById("txtnote").textContent = info.mode === "adb"
      ? "Через ADB Android принимает только латиницу, цифры и знаки. Для кириллицы используйте экранную клавиатуру панели."
      : "Кириллица вводится через буфер обмена (нужен pyperclip на компьютере панели).";
  }

  // ---------- Вкладки ----------
  document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll("main section").forEach(s => s.classList.toggle("on", s.id === b.dataset.tab));
  }));

  // ---------- Кнопки (с автоповтором при удержании) ----------
  document.querySelectorAll("[data-key]").forEach(btn => {
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); btn.classList.remove("pressed"); };
    btn.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (btn.dataset.confirm && !confirm(btn.dataset.confirm)) return;
      btn.classList.add("pressed");
      if (navigator.vibrate) navigator.vibrate(10);
      api("key", { key: btn.dataset.key });
      if (btn.hasAttribute("data-repeat")) {
        t1 = setTimeout(() => { t2 = setInterval(() => api("key", { key: btn.dataset.key }), 120); }, 450);
      }
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener("contextmenu", e => e.preventDefault());
  });

  // ---------- Тачпад ----------
  const pad = document.getElementById("pad");
  const sens = document.getElementById("sens");
  try { const s = localStorage.getItem("irbis_sens"); if (s) sens.value = s; } catch (e) {}
  sens.addEventListener("change", () => { try { localStorage.setItem("irbis_sens", sens.value); } catch (e) {} });

  function ripple(x, y) {
    const r = pad.getBoundingClientRect(), d = document.createElement("div");
    d.className = "ripple"; d.style.left = (x - r.left) + "px"; d.style.top = (y - r.top) + "px";
    pad.appendChild(d); setTimeout(() => d.remove(), 450);
  }
  const norm = t => { const r = pad.getBoundingClientRect(); return { x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height }; };

  // Отправка движения пачками — не чаще одного запроса за раз
  let accX = 0, accY = 0, accS = 0, inflight = false;
  async function flush() {
    if (inflight) return;
    inflight = true;
    while (Math.round(accX) || Math.round(accY) || Math.abs(accS) >= 1) {
      if (Math.round(accX) || Math.round(accY)) {
        const dx = Math.round(accX), dy = Math.round(accY); accX -= dx; accY -= dy;
        await api("move", { dx, dy });
      }
      if (Math.abs(accS) >= 1) { const s = Math.trunc(accS); accS -= s; await api("scroll", { dy: s / 10 }); }
    }
    inflight = false;
  }

  let start = null, last = null, maxFingers = 0, moved = false, longT = null;
  pad.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.touches[0];
    if (e.touches.length === 1) {
      start = { x: t.clientX, y: t.clientY, time: Date.now(), n: norm(t) };
      maxFingers = 1; moved = false;
      if (info && info.pad === "absolute") {
        clearTimeout(longT);
        longT = setTimeout(() => { if (!moved && maxFingers === 1) { api("long", start.n); ripple(start.x, start.y); start = null; } }, 600);
      }
    }
    maxFingers = Math.max(maxFingers, e.touches.length);
    last = { x: t.clientX, y: t.clientY };
  }, { passive: false });

  pad.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!last) return;
    const t = e.touches[0], dx = t.clientX - last.x, dy = t.clientY - last.y;
    last = { x: t.clientX, y: t.clientY };
    if (start && Math.hypot(t.clientX - start.x, t.clientY - start.y) > 8) moved = true;
    if (!info || info.pad !== "relative") return;
    const k = parseFloat(sens.value);
    if (e.touches.length >= 2) accS += dy / 4;
    else { const a = 1 + Math.min(Math.hypot(dx, dy) / 20, 2); accX += dx * k * a; accY += dy * k * a; }
    flush();
  }, { passive: false });

  pad.addEventListener("touchend", e => {
    e.preventDefault();
    if (e.touches.length) return; // ещё остались пальцы
    clearTimeout(longT);
    if (!start || !info) { start = null; return; }
    const lt = e.changedTouches[0], dur = Date.now() - start.time;
    if (info.pad === "absolute") {
      const end = norm(lt);
      if (maxFingers >= 2) api("scroll", { dy: (start.n.y - end.y) });
      else if (!moved) { api("tap", start.n); ripple(start.x, start.y); }
      else api("swipe", { x1: start.n.x, y1: start.n.y, x2: end.x, y2: end.y, ms: Math.min(Math.max(dur, 100), 1500) });
    } else if (!moved && dur < 300) {
      api("click", { button: maxFingers >= 2 ? "right" : "left" });
      ripple(start.x, start.y);
    }
    start = null; last = null;
  }, { passive: false });

  document.getElementById("lclick").addEventListener("click", () => api("click", { button: "left" }));
  document.getElementById("rclick").addEventListener("click", () => api("click", { button: "right" }));
  const dragbtn = document.getElementById("dragbtn");
  let dragging = false;
  dragbtn.addEventListener("click", () => {
    dragging = !dragging;
    dragbtn.classList.toggle("accent", dragging);
    dragbtn.textContent = dragging ? "Отпустить" : "Удерживать";
    api("drag", { state: dragging ? "down" : "up" });
  });

  // ---------- Текст ----------
  document.getElementById("sendtxt").addEventListener("click", async () => {
    const ta = document.getElementById("txt");
    if (ta.value && await api("text", { text: ta.value })) ta.value = "";
  });

  // Запрет масштабирования жестами в Safari
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault());

  loadInfo();
  const modeLabel = () => info && info.mode === "adb" ? "Android панели (ADB)" : "Компьютер панели";
  setInterval(() => {
    if (document.visibilityState !== "visible" || !info) return;
    fetch("/api/info", { headers }).then(r => r.ok && dot.className === "err" && setStatus(true, modeLabel()))
      .catch(() => setStatus(false, "сервер недоступен"));
  }, 5000);
})();
</script>
</body>
</html>
